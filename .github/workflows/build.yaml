name: build

on:
  push:
    branches: [main]
  pull_request:

# One pipeline at a time per branch, because update-manifest below is a blind
# `sed` of whichever digest its own run produced. Two merges to main in quick
# succession otherwise run their pipelines in parallel and the LAST one to
# finish wins -- which is not the same as the newest commit.
#
# Measured 2026-08-12 in this repo. #41 merged at 00:18:38Z and #40 at
# 00:18:41Z -- three seconds apart, with #40 the newer of the two and
# carrying #41's commit 4ee2ff7 as its parent. Two pipelines therefore ran
# concurrently. agora-claude-bridge-config took exactly one commit out of
# that window, 63af6e3 at 00:20:39Z, pinning the deployment to
# sha256:dd38617... -- and the pod that came up served a 404 for
# /health/database, the endpoint #40 had just added. So the deployed image
# did not contain the newer of the two merges. Every check was green: CI
# passed on both, both images built, ArgoCD synced, nothing reported an
# error anywhere.
#
# Deliberately NOT claimed, because two primary sources disagree and this
# comment is not the place to pick a winner:
#   - which commit's build produced sha256:dd38617. The registry tags say
#     sha-4ee2ff7 -> dd38617 and sha-f36df04 -> 49201d4
#     (gh api /orgs/SokratesAI/packages/container/agora-claude-bridge/versions),
#     but the build-push job logs of BOTH runs 31549742746 and 31549746111
#     report Digest dd38617 despite different ImageIDs, which cannot be
#     right either. Unresolved; see the note in nova/resources/issues.md.
#   - which build *finished* first. An earlier draft of this comment said
#     #41's pushed "one second later". Nobody ever measured that -- it was a
#     plausible number that became a fact by being written down and copied
#     into four repositories, which is what this edit exists to undo.
#
# None of that ambiguity touches the fix: two unserialised pipelines both
# blind-`sed` the same manifest, and only one commit landed.
#
# cancel-in-progress stays false deliberately: killing a run partway through
# update-manifest is the exact failure this is meant to prevent. Queued runs
# are superseded by newer ones, so the last write is main's tip either way.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sokratesai/${{ github.event.repository.name }}
  CONFIG_REPO: SokratesAI/${{ github.event.repository.name }}-config

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for org repos —
        # the underlying gitleaks CLI is free/OSS, run that directly instead.
        #
        # This scans the whole commit HISTORY, so a credential-shaped string that
        # reaches main fails every future run on main, not just its own PR — and
        # the fix at that point is a history rewrite. That is why the failure
        # message below spells out the escape hatch: the moment to use it is now,
        # on the PR, not after merge.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact || {
            echo "::error::Secret scan failed. If the finding is a FABRICATED test fixture, append '# gitleaks:allow' to that line and push again — it is per-line, stays visible in review, and needs no config file. If it is a REAL credential: do not allowlist it, rotate it, and do not merge this branch (the scan reads history, so the leak survives deleting the line)."
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pyyaml is test-only: tests/test_build_workflow.py parses this file
      # structurally rather than grepping it.
      - run: pip install pytest pyyaml
      - run: python -m compileall bridge run.py
      - run: pytest tests/ -q

  # bridge/vault_tool.py and agora_runner/vault.py in agora-persona-runner are
  # two hand-written copies of one client against one CouchDB. Cycles 136-142,
  # 148, 151 and 167 each wrote the same fix into both by hand, and nothing
  # noticed a miss. The comparison lives in the runner as
  # tools/sync_contract.py and is checked out here rather than copied --
  # a second copy of the drift checker is the drift it checks for.
  #
  # This job is the mirror of the runner's, and both are needed: the runner's
  # only runs when the runner changes, so a one-sided edit to this file would
  # otherwise reach main with nothing having compared it to anything.
  #
  # Separate from `test` so a token that cannot reach the other repo fails on
  # its own line, and not a dependency of build-push: drift is a fact about
  # both repos, not a reason to stop shipping one of them.
  vault-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate installation token scoped to the runner repo only
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          owner: SokratesAI
          repositories: agora-persona-runner
      - uses: actions/checkout@v7
        with:
          repository: SokratesAI/agora-persona-runner
          token: ${{ steps.app-token.outputs.token }}
          path: .runner
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Run from the runner checkout so the tool imports as `tools.`, and
      # point back out at this repo's copy.
      # The CI-workflow pair is compared as parsed YAML rather than as text,
      # so this job needs pyyaml even though the other two pairs do not.
      - run: pip install pyyaml
      - run: python -m tools.sync_contract . ..
        working-directory: .runner

  build-push:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      # The container driver, because the docker driver cannot export a
      # cache at all -- `cache-to` below is refused outright without this.
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Restore this repo's own layers instead of rebuilding all of them,
          # so an image whose contents did not change keeps its digest, and
          # the "no manifest change, skipping commit" branch further down can
          # actually be taken.
          #
          # Measured Cycle 844 on agora-persona-runner, whose copy of this job
          # is the same job: 79 of its last 150 merges to main changed no file
          # the image ships and all 150 still produced a distinct digest --
          # two consecutive pushes shared their base layers and differed on
          # every layer the Dockerfile adds, because `apt-get`, the pinned
          # downloads and `COPY` were rebuilt from scratch and bake fresh
          # mtimes into the layer tar. This repo has the same pipeline and the
          # same Dockerfile shape, so it has the same behaviour; the numbers
          # above are the runner's, not this repo's, and are quoted rather
          # than restated as if they had been measured here.
          #
          # A cold or evicted cache degrades to exactly today's behaviour: a
          # new digest and a roll, which is the safe direction.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The container driver would otherwise attach a provenance
          # attestation, which turns the pushed object into an index whose
          # digest embeds this build's own timestamps -- non-reproducible for
          # the same reason the layers were, and a different manifest shape
          # than the one every digest in -config today names.
          provenance: false

      # Commits the new image digest to this service's paired config repo, which
      # ArgoCD's SCM Provider generator auto-deploys — no platform-config PR, no
      # manual step. Authenticates as a GitHub App installation, scoped by this
      # step to ONLY this repo's own -config repo (never broader). ORG_APP_ID/
      # ORG_APP_PRIVATE_KEY are repo-scoped Actions secrets that this Composition
      # itself provisions on every source repo it creates (see the
      # source-actions-secret-* resources in this Composition) — not org-level
      # secrets, which GitHub gates behind a paid plan for private repos. See
      # Platform-Product-Catalog's _context.md in the vault for why a GitHub App
      # instead of a PAT. Byte-identical across every service template instance —
      # nothing here is per-service except GitHub's own repository context, so
      # nothing needed substituting at repo-creation time.
      #
      # This was a fourth job, `update-manifest`, until Cycle 224. It is a `sed`
      # and a `git push` — a few seconds of work billed as a whole minute on
      # every merge, because GitHub rounds per job. It only ever ran after
      # `build-push` succeeded, so running it here as that job's last step is
      # the same order for a minute less. Two things improved by accident: the
      # digest no longer travels through a job output, and a failed manifest
      # commit now reddens `build-push` instead of a job Cycle 222 discovered
      # nothing was watching.
      #
      # The config repo is checked out into `.config` rather than the workspace
      # root, because unlike the old job this one already has this repo's own
      # source checked out and must not clobber it.
      # Nothing between `docker build` and the digest commit below had ever
      # STARTED this container, and on 2026-09-02 that cost ten hours. #660
      # added `import yaml` to a runtime module while the Dockerfile had no
      # pip install step; 5,794 tests passed (the CI runner installs pyyaml
      # for a test that parses this very file), the image built, the digest
      # landed in -config, and every replacement pod died on startup with
      # ModuleNotFoundError. Single replica, strategy Recreate, no fallback
      # pod: the heartbeat simply stopped, 19:01Z to 05:02Z, and Nova is the
      # thing that watches this system, so nothing reported it.
      #
      # tests/test_shipped_imports_are_installable.py (#664) closes that one
      # class statically, by comparing what the image imports against what it
      # installs. This step is the other half and it is deliberately not a
      # smarter version of the same idea: it runs the artefact, so it also
      # covers what static analysis structurally cannot -- a COPY that misses
      # a file, a wheel that installs but will not import here, a pinned
      # download that 404s, a permission the `runner` user does not have.
      #
      # It pulls by digest rather than reusing a local build, so what is
      # tested is the exact bytes the manifest is about to name. No env is
      # supplied on purpose: every setting in agora_runner/config.py has a
      # default and poll_once swallows its own errors, so an unconfigured
      # runner comes up and polls into the void exactly like a configured one
      # -- which makes "did the process stay up" a question about the image
      # and not about secrets this job does not have.
      #
      # Both entrypoints are checked because one image serves two Deployments.
      # This copy and agora-persona-runner's are compared whole by
      # tools/sync_contract.py, which is why the step discovers what to start
      # instead of naming it: the two images ship different entrypoints.
      #
      # A failure here leaves the image pushed to GHCR but unreferenced, which
      # is harmless -- only the digest commit below deploys anything.
      - name: Smoke-test the pushed image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          entrypoints=$(docker run --rm --entrypoint sh "$IMAGE" -c 'ls /app/run*.py 2>/dev/null' || true)
          if [ -z "$entrypoints" ]; then
            echo "::error::the image ships no /app/run*.py, so this step would start nothing and pass. Either the COPY changed or the entrypoints were renamed."
            exit 1
          fi
          for ep in $entrypoints; do
            echo "--- starting $ep ---"
            # --tmpfs /data because both Deployments mount a volume there and
            # the image's non-root user cannot create it: the bridge's
            # bootstrap_credentials() does makedirs("/data/claude-home") on its
            # first line and died with EACCES the first time this step ran on
            # main. A writable empty /data is the deployment contract, so
            # supplying one tests the image rather than papering over it.
            cid=$(docker run -d --tmpfs /data:rw,mode=1777 --entrypoint python "$IMAGE" "$ep")
            sleep 20
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
              echo "::error::$ep exited with code $code inside the built image. This digest is NOT being deployed. Logs follow."
              docker logs "$cid" 2>&1 || true
              docker rm -f "$cid" >/dev/null 2>&1 || true
              exit 1
            fi
            docker logs "$cid" 2>&1 | head -30
            docker rm -f "$cid" >/dev/null 2>&1 || true
          done

      - name: Generate installation token scoped to the config repo only
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          owner: SokratesAI
          repositories: ${{ github.event.repository.name }}-config
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: .config
      - name: Update image digest in manifest.yaml
        working-directory: .config
        run: |
          sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}|" manifest.yaml
          git config user.name "sokratesai-repo-committer[bot]"
          git config user.email "sokratesai-repo-committer[bot]@users.noreply.github.com"
          git add manifest.yaml
          if git diff --staged --quiet; then
            echo "no manifest change, skipping commit"
          else
            git commit -m "Update image to ${{ steps.build.outputs.digest }}"
            git push
          fi
